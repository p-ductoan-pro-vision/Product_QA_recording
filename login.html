<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProVision Extension – Login Mockup</title>
<style>
    :root {
        --brand: #1565c0;
        --brand-600: #0f56ad;
        --brand-50: #eaf2fd;
        --ink: #3a3a3c;
        --ink-2: #6b7280;
        --ink-3: #9ca3af;
        --line: #e5e7eb;
        --bg-soft: #f6f7f9;
        --red: #e5484d;
        --red-50: #fdecec;
        --green: #16a34a;
        --green-50: #e8f7ee;
        --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Inter", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
        background: #eef1f5;
        color: var(--ink);
        padding: 40px 48px 64px;
    }
    button, input { font-family: inherit; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
    .page-head h1 { font-size: 24px; font-weight: 700; color: #1f2937; }
    .page-head p { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
    .page-head a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .global-lang { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2); }

    .frames { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
    .frame { display: flex; flex-direction: column; gap: 10px; }
    .frame-label { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .3px; }
    .frame-label b { color: #1f2937; }

    .panel {
        width: 360px;
        background: #fff;
        border-radius: var(--radius);
        box-shadow: 0 12px 32px rgba(15, 35, 70, .12), 0 2px 6px rgba(15, 35, 70, .06);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .p-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--line);
        cursor: move;
    }
    .p-header img { height: 18px; display: block; }
    .p-actions { display: flex; align-items: center; gap: 6px; }

    .lang {
        display: inline-flex; background: var(--bg-soft); border: 1px solid var(--line);
        border-radius: 8px; padding: 2px; gap: 2px;
    }
    .lang button {
        border: none; background: transparent; font-size: 10px; font-weight: 600;
        color: var(--ink-2); padding: 3px 7px; border-radius: 6px; cursor: pointer;
    }
    .lang button.active { background: #fff; color: var(--brand); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

    .icon-btn {
        width: 26px; height: 26px; border: none; background: transparent; border-radius: 7px;
        display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); cursor: pointer;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--ink); }
    .icon-btn svg { width: 16px; height: 16px; }

    .p-body { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

    .title h2 { font-size: 18px; font-weight: 700; color: #1f2937; }
    .title p { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--ink-2); }
    .input-wrap {
        display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px;
        border: 1px solid var(--line); border-radius: 10px; background: #fff;
        transition: border-color .15s, box-shadow .15s;
    }
    .input-wrap > svg { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; }
    .input-wrap input {
        flex: 1; min-width: 0; border: none; outline: none; font-size: 13px; color: #1f2937; background: transparent;
    }
    .input-wrap input::placeholder { color: var(--ink-3); }
    .input-wrap:focus-within, .input-wrap.focused { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(21,101,192,.12); }
    .input-wrap:focus-within > svg, .input-wrap.focused > svg { color: var(--brand); }
    .input-wrap.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(229,72,77,.10); }
    .input-wrap.error > svg { color: var(--red); }
    .input-wrap.disabled { background: var(--bg-soft); }
    .eye { border: none; background: transparent; color: var(--ink-3); cursor: pointer; display: inline-flex; padding: 2px; }
    .eye:hover { color: var(--ink); }
    .eye svg { width: 16px; height: 16px; }

    .banner {
        font-size: 11px; font-weight: 500; line-height: 1.45; padding: 8px 10px; border-radius: 8px;
        display: flex; gap: 6px; align-items: flex-start;
    }
    .banner svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
    .banner.error { background: var(--red-50); color: #b91c1c; }
    .banner.success { background: var(--green-50); color: #166534; }

    .btn {
        border: none; border-radius: 10px; height: 44px; width: 100%; font-size: 13px; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        background: var(--brand); color: #fff; box-shadow: 0 4px 10px rgba(21,101,192,.25);
        transition: filter .15s, transform .05s;
    }
    .btn:hover:not(:disabled) { filter: brightness(.96); }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { cursor: not-allowed; opacity: .75; }
    .btn.success { background: var(--green); box-shadow: 0 4px 10px rgba(22,163,74,.25); }
    .btn svg { width: 16px; height: 16px; }
    .spinner {
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .p-footer {
        padding: 10px 14px; border-top: 1px solid var(--line); background: #fcfcfd;
        font-size: 10px; color: var(--ink-3); text-align: center;
    }
</style>
</head>
<body>

<div class="page-head">
    <div>
        <h1>ProVision Extension – Login Mockup</h1>
        <p>Panel 360px · Same style as <a href="index.html">main panel</a> · Demo: password with 4+ characters signs in successfully</p>
    </div>
    <div class="global-lang">
        <span>All frames:</span>
        <div class="lang" id="global-lang"></div>
    </div>
</div>

<div class="frames" id="frames"></div>

<script>
const ICONS = {
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

const I18N = {
    en: {
        login: 'Sign in', subtitle: 'Sign in to start recording scenarios.',
        username: 'Username', password: 'Password',
        ph_user: 'Enter your username', ph_pass: 'Enter your password',
        logging_in: 'Signing in...', login_ok: 'Signed in successfully',
        required: 'Please enter username and password',
        invalid: 'Invalid username or password',
        unreachable: 'Cannot connect to the server',
        footer: 'ProVision Data Collector',
        f_default: 'Login – Default', f_focus: 'Login – Typing', f_error: 'Login – Error',
        f_loading: 'Login – Signing in', f_success: 'Login – Success'
    },
    ja: {
        login: 'ログイン', subtitle: 'ログインしてシナリオの記録を開始します。',
        username: 'ユーザー名', password: 'パスワード',
        ph_user: 'ユーザー名を入力', ph_pass: 'パスワードを入力',
        logging_in: 'ログイン中...', login_ok: 'ログインしました',
        required: 'ユーザー名とパスワードを入力してください',
        invalid: 'ユーザー名またはパスワードが正しくありません',
        unreachable: 'サーバーに接続できません',
        footer: 'ProVision Data Collector',
        f_default: 'ログイン – 初期', f_focus: 'ログイン – 入力中', f_error: 'ログイン – エラー',
        f_loading: 'ログイン – 処理中', f_success: 'ログイン – 成功'
    },
    vi: {
        login: 'Đăng nhập', subtitle: 'Đăng nhập để bắt đầu ghi kịch bản.',
        username: 'Tên đăng nhập', password: 'Mật khẩu',
        ph_user: 'Nhập tên đăng nhập', ph_pass: 'Nhập mật khẩu',
        logging_in: 'Đang đăng nhập...', login_ok: 'Đăng nhập thành công',
        required: 'Nhập tên đăng nhập và mật khẩu',
        invalid: 'Sai tên đăng nhập hoặc mật khẩu',
        unreachable: 'Không kết nối được máy chủ',
        footer: 'ProVision Data Collector',
        f_default: 'Đăng nhập – Mặc định', f_focus: 'Đăng nhập – Đang nhập', f_error: 'Đăng nhập – Lỗi',
        f_loading: 'Đăng nhập – Đang xử lý', f_success: 'Đăng nhập – Thành công'
    }
};
const LANGS = [['en', 'EN'], ['ja', '日本'], ['vi', 'VN']];

// status: idle | loading | success | error ; msg: i18n key of banner
const FRAMES = [
    { key: 'f_default', user: '', pass: '', status: 'idle' },
    { key: 'f_focus', user: 'teacher01', pass: '', status: 'idle', focus: 'user' },
    { key: 'f_error', user: 'teacher01', pass: 'abc', status: 'error', msg: 'invalid', errUser: true, errPass: true },
    { key: 'f_loading', user: 'teacher01', pass: 'password', status: 'loading' },
    { key: 'f_success', user: 'teacher01', pass: 'password', status: 'success', msg: 'login_ok' }
].map(f => ({ lang: 'ja', showPass: false, ...f }));

function esc(v) { return String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function langSwitch(active) {
    return `<div class="lang">${LANGS.map(([k, l]) =>
        `<button data-act="lang" data-lang="${k}" class="${k === active ? 'active' : ''}">${l}</button>`).join('')}</div>`;
}

function renderPanel(s) {
    const t = I18N[s.lang];
    const busy = s.status === 'loading' || s.status === 'success';
    const wrapCls = (name, err) => ['input-wrap',
        s.focus === name ? 'focused' : '',
        err ? 'error' : '',
        busy ? 'disabled' : ''].join(' ');

    let banner = '';
    if (s.status === 'error') banner = `<div class="banner error">${ICONS.alert}<span>${t[s.msg]}</span></div>`;
    if (s.status === 'success') banner = `<div class="banner success">${ICONS.check}<span>${t[s.msg]}</span></div>`;

    let btn;
    if (s.status === 'loading') btn = `<button class="btn" disabled><span class="spinner"></span>${t.logging_in}</button>`;
    else if (s.status === 'success') btn = `<button class="btn success" disabled>${ICONS.check}${t.login_ok}</button>`;
    else btn = `<button class="btn" data-act="submit">${t.login}${ICONS.arrow}</button>`;

    return `
        <div class="p-header">
            <img src="logo/logo.png" alt="ProVision">
            <div class="p-actions">
                ${langSwitch(s.lang)}
                <button class="icon-btn" title="Close">${ICONS.close}</button>
            </div>
        </div>
        <div class="p-body">
            <div class="title">
                <h2>${t.login}</h2>
                <p>${t.subtitle}</p>
            </div>
            <div class="field">
                <label>${t.username}</label>
                <div class="${wrapCls('user', s.errUser)}">
                    ${ICONS.user}
                    <input data-field="user" type="text" autocomplete="username" placeholder="${t.ph_user}" value="${esc(s.user)}" ${busy ? 'disabled' : ''}>
                </div>
            </div>
            <div class="field">
                <label>${t.password}</label>
                <div class="${wrapCls('pass', s.errPass)}">
                    ${ICONS.lock}
                    <input data-field="pass" type="${s.showPass ? 'text' : 'password'}" autocomplete="current-password" placeholder="${t.ph_pass}" value="${esc(s.pass)}" ${busy ? 'disabled' : ''}>
                    <button class="eye" data-act="eye" type="button">${s.showPass ? ICONS.eyeOff : ICONS.eye}</button>
                </div>
            </div>
            ${banner}
            ${btn}
        </div>
        <div class="p-footer">${t.footer}</div>`;
}

const framesEl = document.getElementById('frames');

function renderAll() {
    framesEl.innerHTML = FRAMES.map((f, i) => `
        <div class="frame">
            <div class="frame-label"><b>${String(i + 1).padStart(2, '0')}</b> · ${I18N[f.lang][f.key]}</div>
            <div class="panel" data-i="${i}">${renderPanel(f)}</div>
        </div>`).join('');
}

function stateOf(el) { return FRAMES[+el.closest('.panel').dataset.i]; }

function submit(s) {
    s.focus = null;
    s.errUser = !s.user.trim();
    s.errPass = !s.pass;
    if (s.errUser || s.errPass) {
        s.status = 'error'; s.msg = 'required';
        return renderAll();
    }
    s.status = 'loading';
    renderAll();
    setTimeout(() => {
        if (s.pass.length >= 4) {
            s.status = 'success'; s.msg = 'login_ok';
        } else {
            s.status = 'error'; s.msg = 'invalid'; s.errUser = true; s.errPass = true;
        }
        renderAll();
    }, 1200);
}

framesEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const s = stateOf(btn);
    switch (btn.dataset.act) {
        case 'lang': s.lang = btn.dataset.lang; renderAll(); break;
        case 'eye': s.showPass = !s.showPass; renderAll(); break;
        case 'submit': submit(s); break;
    }
});

framesEl.addEventListener('input', e => {
    const input = e.target.closest('[data-field]');
    if (!input) return;
    const s = stateOf(input);
    s[input.dataset.field] = input.value;
    const wrap = input.closest('.input-wrap');
    if (wrap.classList.contains('error')) {
        wrap.classList.remove('error');
        if (input.dataset.field === 'user') s.errUser = false; else s.errPass = false;
    }
});

framesEl.addEventListener('focusin', e => {
    const input = e.target.closest('[data-field]');
    if (!input) return;
    FRAMES.forEach(f => f.focus = null);
    document.querySelectorAll('.input-wrap.focused').forEach(w => w.classList.remove('focused'));
});

framesEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const input = e.target.closest('[data-field]');
    if (!input) return;
    const s = stateOf(input);
    if (s.status !== 'loading' && s.status !== 'success') submit(s);
});

const globalLang = document.getElementById('global-lang');
function renderGlobalLang(active) {
    globalLang.innerHTML = LANGS.map(([k, l]) =>
        `<button data-lang="${k}" class="${k === active ? 'active' : ''}">${l}</button>`).join('');
}
globalLang.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (!b) return;
    FRAMES.forEach(f => f.lang = b.dataset.lang);
    renderGlobalLang(b.dataset.lang);
    renderAll();
});

renderGlobalLang('ja');
renderAll();
</script>
</body>
</html>
