<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProVision Admin – UI Mockup</title>
<style>
    :root {
        --brand: #1565c0;
        --brand-600: #0f56ad;
        --brand-50: #eaf2fd;
        --ink: #3a3a3c;
        --ink-strong: #1f2937;
        --ink-2: #6b7280;
        --ink-3: #9ca3af;
        --line: #e5e7eb;
        --bg: #eef1f5;
        --bg-soft: #f6f7f9;
        --red: #e5484d;
        --red-50: #fdecec;
        --amber: #f59e0b;
        --amber-50: #fef5e2;
        --green: #16a34a;
        --green-50: #e8f7ee;
        --radius: 14px;
        --topbar: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: "Inter", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-width: 1280px;
        overflow: hidden;
    }
    button, input, select { font-family: inherit; }
    svg { display: block; }

    /* ---------- Topbar ---------- */
    .topbar {
        height: var(--topbar); background: #fff; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        position: relative; z-index: 20;
    }
    .tb-left { display: flex; align-items: center; gap: 16px; }
    .tb-left img { height: 22px; }
    .tb-divider { width: 1px; height: 26px; background: var(--line); }
    .tb-title { font-size: 14px; font-weight: 700; color: var(--ink-strong); }
    .tb-sub { font-size: 11px; color: var(--ink-2); margin-top: 1px; }
    .tb-right { display: flex; align-items: center; gap: 12px; }

    .lang {
        display: inline-flex; background: var(--bg-soft); border: 1px solid var(--line);
        border-radius: 8px; padding: 2px; gap: 2px;
    }
    .lang button {
        border: none; background: transparent; font-size: 11px; font-weight: 600;
        color: var(--ink-2); padding: 4px 9px; border-radius: 6px; cursor: pointer;
    }
    .lang button.active { background: #fff; color: var(--brand); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

    .acct { position: relative; }
    .acct-btn {
        display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line);
        border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink);
    }
    .acct-btn:hover, .acct-btn.open { border-color: var(--brand); }
    .avatar {
        width: 28px; height: 28px; border-radius: 50%; background: var(--brand-50); color: var(--brand);
        display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .acct-btn .chev { width: 14px; height: 14px; color: var(--ink-3); transition: transform .15s; }
    .acct-btn.open .chev { transform: rotate(180deg); }
    .menu {
        position: absolute; right: 0; top: calc(100% + 8px); width: 260px; background: #fff;
        border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(15,35,70,.14);
        overflow: hidden; padding: 6px;
    }
    .menu-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .menu-head .name { font-size: 13px; font-weight: 700; color: var(--ink-strong); }
    .menu-head .role { font-size: 11px; color: var(--ink-2); }
    .menu-item {
        width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 10px;
        padding: 9px 10px; border-radius: 8px; font-size: 13px; color: var(--ink); cursor: pointer; text-align: left;
    }
    .menu-item svg { width: 16px; height: 16px; color: var(--ink-2); }
    .menu-item:hover { background: var(--bg-soft); }
    .menu-item .ver { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--brand); background: var(--brand-50); padding: 2px 6px; border-radius: 5px; }
    .menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
    .menu-item.danger, .menu-item.danger svg { color: var(--red); }
    .menu-item.danger:hover { background: var(--red-50); }

    /* ---------- Layout ---------- */
    .layout {
        height: calc(100vh - var(--topbar)); padding: 16px; gap: 16px;
        display: grid; grid-template-columns: 300px minmax(420px, 1fr) 480px;
    }
    .layout.log-wide { grid-template-columns: 300px 1fr; }
    .layout.log-wide #col-detail { display: none; }

    .col {
        background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: 0 2px 6px rgba(15,35,70,.04);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .col-head {
        padding: 14px 16px; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .col-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink-strong); }
    .col-title svg { width: 18px; height: 18px; color: var(--brand); }
    .count { font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--bg-soft); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; }

    .icon-btn {
        width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-soft); border-color: var(--line); color: var(--ink); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ---------- Scenario list ---------- */
    .search { padding: 12px 12px 8px; flex-shrink: 0; }
    .input-wrap {
        display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
        border: 1px solid var(--line); border-radius: 10px; background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    .input-wrap > svg { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; }
    .input-wrap input, .input-wrap select { flex: 1; min-width: 0; border: none; outline: none; font-size: 13px; color: var(--ink-strong); background: transparent; }
    .input-wrap input::placeholder { color: var(--ink-3); }
    .input-wrap:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(21,101,192,.12); }
    .input-wrap:focus-within > svg { color: var(--brand); }
    .input-wrap.mono input { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }

    .list-body { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .scn {
        display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 10px;
        border: 1px solid transparent; cursor: pointer; transition: background .12s;
    }
    .scn:hover { background: var(--bg-soft); }
    .scn.active { background: var(--brand-50); border-color: rgba(21,101,192,.25); }
    .scn.active .scn-name { color: var(--brand); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #d1d5db; }
    .dot.passed { background: var(--green); }
    .dot.failed { background: var(--red); }
    .dot.running { background: var(--brand); animation: blink 1.1s infinite; }
    .dot.cancelled { background: var(--amber); }
    .scn-main { flex: 1; min-width: 0; }
    .scn-name { font-size: 13px; font-weight: 600; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scn-meta { font-size: 11px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .scn-tools { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
    .scn:hover .scn-tools, .scn.active .scn-tools { opacity: 1; }
    .mini {
        width: 26px; height: 26px; border: none; background: transparent; border-radius: 7px; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3);
    }
    .mini svg { width: 14px; height: 14px; }
    .mini:hover { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .mini.danger:hover { color: var(--red); background: var(--red-50); box-shadow: none; }
    .list-empty { text-align: center; color: var(--ink-3); font-size: 12px; padding: 30px 0; }

    .pager { display: flex; justify-content: center; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--line); flex-shrink: 0; }
    .pg {
        min-width: 30px; height: 30px; border: 1px solid var(--line); background: #fff; border-radius: 8px;
        font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    }
    .pg svg { width: 14px; height: 14px; }
    .pg:hover { border-color: var(--brand); color: var(--brand); }
    .pg.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .pg.gap { border: none; background: transparent; cursor: default; }

    /* ---------- Detail ---------- */
    .empty-state {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        text-align: center; padding: 40px; color: var(--ink-2);
    }
    .empty-ill {
        width: 72px; height: 72px; border-radius: 20px; background: var(--brand-50); color: var(--brand);
        display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    }
    .empty-ill svg { width: 34px; height: 34px; }
    .empty-state h3 { font-size: 16px; color: var(--ink-strong); }
    .empty-state p { font-size: 12px; max-width: 300px; line-height: 1.6; }

    .d-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .d-title { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; color: var(--ink-strong); min-width: 0; }
    .d-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .d-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
    .d-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
    .d-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
        border: 1px solid transparent; border-radius: 10px; height: 38px; padding: 0 14px; font-size: 13px; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
        transition: filter .15s, transform .05s; white-space: nowrap;
    }
    .btn svg { width: 15px; height: 15px; }
    .btn:hover:not(:disabled) { filter: brightness(.96); }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 10px rgba(21,101,192,.22); }
    .btn-danger { background: var(--red); color: #fff; box-shadow: 0 4px 10px rgba(229,72,77,.22); }
    .btn-outline { background: #fff; border-color: var(--line); color: var(--ink); }
    .btn-outline:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); filter: none; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
    .btn-sm svg { width: 13px; height: 13px; }

    .d-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 18px 0; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--ink-2); }

    .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .subtab {
        border: none; background: transparent; padding: 8px 4px 9px; margin-right: 14px; font-size: 13px; font-weight: 600;
        color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
    }
    .subtab.active { color: var(--brand); border-bottom-color: var(--brand); }
    .subtab .count { font-size: 10px; }

    .steps-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 16px; display: flex; flex-direction: column; gap: 6px; }
    .step {
        display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: #fff; font-size: 13px; transition: background .2s, border-color .2s;
    }
    .step:hover { border-color: #d1d5db; }
    .s-idx { width: 22px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .chip {
        font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 7px; border-radius: 5px;
        background: var(--brand-50); color: var(--brand); flex-shrink: 0;
    }
    .chip.input { background: #f3e8ff; color: #7c3aed; }
    .chip.nav { background: #e0f2fe; color: #0369a1; }
    .s-desc { flex: 1; min-width: 0; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-val {
        width: 140px; height: 28px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font-size: 12px; outline: none;
    }
    .s-val:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(21,101,192,.12); }
    .s-state { width: 18px; display: flex; justify-content: center; }
    .s-state svg { width: 16px; height: 16px; }
    .step.running { background: var(--brand-50); border-color: rgba(21,101,192,.4); }
    .step.running .s-idx { color: var(--brand); }
    .step.ok .s-state { color: var(--green); }
    .step.fail { background: var(--red-50); border-color: #f5b5b7; }
    .step.fail .s-idx, .step.fail .s-state { color: var(--red); }
    .spinner {
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid rgba(21,101,192,.25); border-top-color: var(--brand); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: .3; } }

    .rep {
        display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    }
    .rep-main { flex: 1; }
    .rep-title { font-size: 13px; font-weight: 600; color: var(--ink-strong); }
    .rep-meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }

    .badge {
        font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.idle, .badge.none { background: var(--bg-soft); color: var(--ink-2); }
    .badge.running { background: var(--brand-50); color: var(--brand); }
    .badge.running::before { animation: blink 1.1s infinite; }
    .badge.passed { background: var(--green-50); color: var(--green); }
    .badge.failed { background: var(--red-50); color: var(--red); }
    .badge.cancelled { background: var(--amber-50); color: #b45309; }

    /* ---------- Log ---------- */
    .log-tools { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .log-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .seg { display: inline-flex; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
    .seg button {
        border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--ink-2);
        padding: 5px 10px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .seg button.active { background: #fff; color: var(--ink-strong); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .seg .n { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 5px; background: var(--line); color: var(--ink-2); }
    .seg .n.err { background: var(--red-50); color: var(--red); }
    .seg .n.warn { background: var(--amber-50); color: #b45309; }
    .opts { display: flex; gap: 14px; }
    .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; }
    .check input { accent-color: var(--brand); width: 14px; height: 14px; cursor: pointer; }
    .artifacts { display: flex; gap: 6px; }

    .log-box {
        flex: 1; min-height: 0; overflow: auto; margin: 12px; border-radius: 10px; background: #0f1720;
        padding: 12px 0; font-family: ui-monospace, "Cascadia Code", Consolas, "Roboto Mono", monospace; font-size: 12px; line-height: 1.6;
    }
    .ln { display: flex; gap: 12px; padding: 1px 14px; color: #d6e2ee; white-space: pre-wrap; word-break: break-word; }
    .ln:hover { background: rgba(255,255,255,.04); }
    .ln .ts { color: #52606d; flex-shrink: 0; user-select: none; }
    .ln .tx { flex: 1; }
    .ln.dbg .tx { color: #8395a7; }
    .ln.warn .tx { color: #f5b041; }
    .ln.err .tx { color: #ff6b6b; }
    .ln.ok .tx { color: #4ade80; }
    .ln.trace .tx { color: #ff9a9a; padding-left: 16px; }
    .ln.fold .tx { color: #ff9a9a; cursor: pointer; text-decoration: underline dotted; }
    .log-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #52606d; font-size: 12px; font-family: "Inter", "Segoe UI", sans-serif; }
    .log-empty svg { width: 30px; height: 30px; }

    /* ---------- Modals ---------- */
    .overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 100;
        animation: fade .15s ease;
    }
    @keyframes fade { from { opacity: 0; } }
    .modal {
        background: #fff; border-radius: 16px; box-shadow: 0 24px 60px rgba(15,35,70,.25); max-height: 88vh; overflow: auto;
        display: flex; flex-direction: column;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { font-size: 16px; color: var(--ink-strong); }
    .modal-head p { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
    .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
    .modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: #fcfcfd; }

    .create-card { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .create-card h4 { font-size: 13px; color: var(--ink-strong); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .create-card h4 svg { width: 16px; height: 16px; color: var(--brand); }
    .create-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 130px; gap: 10px; align-items: end; }
    .create-grid .span-3 { grid-column: span 3; }
    .form-hint { font-size: 11px; color: var(--ink-3); margin-top: 8px; }
    td .em { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    td .em > svg { width: 12px; height: 12px; color: var(--ink-3); flex-shrink: 0; }
    td .em span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td .em.missing span { color: var(--amber); font-style: italic; }
    td .em .mini { width: 22px; height: 22px; opacity: 0; }
    tr:hover td .em .mini, td .em.missing .mini { opacity: 1; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    td .u { display: flex; align-items: center; gap: 10px; }
    td .u .avatar { width: 30px; height: 30px; }
    td .u .un { font-weight: 600; color: var(--ink-strong); }
    td .u .dn { font-size: 11px; color: var(--ink-3); }
    .sel {
        height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: 12px; font-weight: 600; background: #fff; color: var(--ink); outline: none;
    }
    .sel:focus { border-color: var(--brand); }
    .toggle { position: relative; width: 34px; height: 20px; display: inline-block; cursor: pointer; vertical-align: middle; }
    .toggle input { display: none; }
    .toggle span { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: background .15s; }
    .toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .toggle input:checked + span { background: var(--green); }
    .toggle input:checked + span::after { transform: translateX(14px); }
    .t-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

    .banner { font-size: 12px; font-weight: 500; line-height: 1.45; padding: 9px 11px; border-radius: 8px; display: flex; gap: 6px; align-items: flex-start; }
    .banner svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
    .banner.error { background: var(--red-50); color: #b91c1c; }
    .banner.success { background: var(--green-50); color: #166534; }

    .toast {
        position: fixed; right: 20px; bottom: 20px; background: var(--ink-strong); color: #fff; font-size: 13px; font-weight: 600;

        if (!traceBuf.length) return;
        if (S.collapse && !S.expandedTrace) {
            out.push(`<div class="ln fold" data-act="expand-trace"><span class="ts">${traceBuf[0].ts}</span><span class="tx">▸ ${t('traceback', { n: traceBuf.length })}</span></div>`);

/* ---------- Job simulation ---------- */
function buildJobLines(s, jobId) {
    const L = [];
    const n = s.steps.length;
    const push = (cls, text, fx) => L.push({ cls, text, fx });
    push('', `[replay] job #${jobId} started – scenario "${s.name}"`);
    if (s.warnLogin) push('warn', `[replay] WARNING: login not prepended (host=demo.example.jp): account unknown and 2 accounts are saved for this host; set ログインアカウント on the scenario in the dashboard`);
    push('', `[replay] screenshots → uploads/screenshots/job_${jobId}/run_20260929T084859`);
    push('', `[replay] ${n} step(s) — starting at ${s.url}`);
    push('dbg', `  [dbg] replay start debug_enabled=True step_count=${n}`);
    push('', '[replay] navigating…');
    for (let i = 0; i < n; i++) {
        const st = s.steps[i];
        const label = `${i + 1}. ${st.desc}`;
        push('', `[replay] step ${i + 1}/${n}: ${st.type} — ${label}`, { step: i, st: 'running' });
        push('dbg', `  [dbg] find_element start description='${label}' tag='a'`);
        if (i === s.failAt) {
            push('err', `  [dbg] find_element FAILED — no match description='${label}' is_img_step=False has_disambig=False`);
            push('err', `[replay] step ${i + 1}/${n}: ${st.type} — ${label} — FAILED: Element not found`, { step: i, st: 'fail' });
            push('trace', 'Traceback (most recent call last):');
            push('trace', '  File "replayer.py", line 412, in run_step');
            push('trace', '    el = await find_element(page, step)');
            push('trace', 'ElementNotFound: locator("html=<a>連携教材・サービス</a>").nth(0)');
            push('', '  → wait 2000ms then screenshot');
            push('err', `[replay] finished: FAILED at step ${i + 1}/${n}`, { end: 'failed' });
            return L;
        }
        push('ok', `[replay] step ${i + 1}/${n} — OK (${180 + ((i * 97) % 600)}ms)`, { step: i, st: 'ok' });
    }
    push('ok', `[replay] finished: ${n}/${n} steps passed`, { end: 'passed' });
    return L;
}

function fmtTime(d) { return d.toTimeString().slice(0, 8); }

function applyLine(line) {
    const j = S.job;
    j.clock = new Date(j.clock.getTime() + 400 + Math.floor(Math.random() * 900));
    S.logs.push({ cls: line.cls, text: line.text, ts: fmtTime(j.clock) });
    if (line.fx && line.fx.step !== undefined) j.stepStates[line.fx.step] = line.fx.st;
    if (line.fx && line.fx.end) finishJob(line.fx.end);
}

function finishJob(status) {
    const j = S.job;
    clearInterval(S.timer);
    j.status = status;
    const s = SCENARIOS.find(x => x.id === j.scenarioId);
    if (s) {
        s.last = status;
        const dur = ((j.clock - j.started) / 1000).toFixed(1) + 's';
        s.reports.unshift({ job: j.id, date: '2026/9/29 ' + fmtTime(j.clock), status, dur });
    }
}

function startJob(s, instantLines) {
    clearInterval(S.timer);
    const id = S.nextJob++;
    const now = new Date(2026, 8, 29, 11, 33, 0);
    S.job = { id, scenarioId: s.id, status: 'running', lines: buildJobLines(s, id), cursor: 0, stepStates: {}, clock: now, started: now };
    S.logs = [];
    S.filter = 'all';
    S.expandedTrace = false;
    const n = instantLines === Infinity ? S.job.lines.length : (instantLines || 0);
    while (S.job.cursor < Math.min(n, S.job.lines.length)) applyLine(S.job.lines[S.job.cursor++]);
    if (S.job.status === 'running') S.timer = setInterval(tick, 450);
}

function tick() {
    const j = S.job;
    if (!j || j.status !== 'running') return clearInterval(S.timer);
    if (j.cursor >= j.lines.length) return finishJob('passed');
    applyLine(j.lines[j.cursor++]);
    renderList(); renderDetail(); renderLog();
}

function stopJob() {
    const j = S.job;
    if (!j || j.status !== 'running') return;
    Object.keys(j.stepStates).forEach(k => { if (j.stepStates[k] === 'running') delete j.stepStates[k]; });
    S.logs.push({ cls: 'warn', text: `[replay] job #${j.id} cancelled by user`, ts: fmtTime(j.clock) });
    clearInterval(S.timer);
    j.status = 'cancelled';
    const s = SCENARIOS.find(x => x.id === j.scenarioId);
    if (s) s.last = 'cancelled';
}

        </div>`;
    }
}

function showMsg(id, type, text) {
    const el = $(id);
    el.style.display = 'block';
    el.innerHTML = `<div class="banner ${type}">${type === 'error' ? ICONS.alert : ICONS.check}<span>${esc(text)}</span></div>`;
}

/* ---------- Preview bar ---------- */
function renderPreview() {
    const root = $('preview-root');
    if (!S.showPreview) { root.innerHTML = ''; return; }
    root.innerHTML = `
        <div class="preview">
            <span>${t('preview')}</span>
            ${['empty', 'selected', 'running', 'failed'].map(p =>
                `<button class="${S.preview === p ? 'active' : ''}" data-act="preview" data-p="${p}">${t('pv_' + p)}</button>`).join('')}
            <button class="x" data-act="hide-preview" title="Hide">✕</button>
        </div>`;
}

function applyPreview(p) {
    S.preview = p;
    clearInterval(S.timer);
    S.tab = 'steps';
    S.logWide = false;
    const first = SCENARIOS[0];
    if (p === 'empty') { S.selectedId = null; S.job = null; S.logs = []; }
    if (p === 'selected') { S.selectedId = first.id; S.job = null; S.logs = []; }
    if (p === 'running') {
        const s = SCENARIOS.find(x => x.name === 'Tommy 002') || first;
        S.selectedId = s.id;
        startJob(s, 22);
    }
    if (p === 'failed') { S.selectedId = first.id; startJob(first, Infinity); }
    renderAll();
}

function renderAll() {
    document.documentElement.lang = S.lang;
    $('layout').classList.toggle('log-wide', S.logWide);
    renderTopbar(); renderListHead(); renderList(); renderDetail(); renderLog(); renderModal(); renderPreview();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (S.menu && !e.target.closest('.acct')) { S.menu = false; renderTopbar(); }
    if (!a) return;
    const act = a.dataset.act;
    const s = selected();
    switch (act) {
        case 'lang': S.lang = a.dataset.lang; renderAll(); break;
        case 'menu': S.menu = !S.menu; renderTopbar(); break;
        case 'open-users': S.menu = false; S.modal = 'users'; renderTopbar(); renderModal(); break;
        case 'open-cp': S.menu = false; S.modal = 'cp'; renderTopbar(); renderModal(); break;
        case 'download-ext': S.menu = false; renderTopbar(); toast(`data_collect_extension_v${EXT_VER}.zip`); break;
        case 'logout': S.menu = false; renderTopbar(); toast(t('logout')); break;
        case 'overlay': if (e.target === a) { S.modal = null; renderModal(); } break;
        case 'close-modal': S.modal = null; renderModal(); break;

        case 'select':
            S.selectedId = +a.dataset.id;
            S.tab = 'steps';
            if (S.logWide) { S.logWide = false; $('layout').classList.remove('log-wide'); renderLogHead(); }
            renderList(); renderDetail();
            break;
        case 'rename': {
            const x = SCENARIOS.find(v => v.id === +a.dataset.id);
            const name = prompt(t('prompt_rename'), x.name);
            if (name && name.trim()) { x.name = name.trim(); renderList(); renderDetail(); }
            break;
        }
        case 'del-scn': {
            const i = SCENARIOS.findIndex(v => v.id === +a.dataset.id);
            if (i < 0 || !confirm(t('confirm_delete_scenario', { name: SCENARIOS[i].name }))) break;
            if (S.job && S.job.scenarioId === SCENARIOS[i].id && S.job.status === 'running') stopJob();
            if (S.selectedId === SCENARIOS[i].id) S.selectedId = null;
            SCENARIOS.splice(i, 1);
            renderListHead(); renderList(); renderDetail(); renderLog();
            break;
        }
        case 'page': S.page = +a.dataset.page; renderList(); break;
        case 'tab': S.tab = a.dataset.tab; renderDetail(); break;
        case 'del-step':
            if (!confirm(t('confirm_delete_step'))) break;
            s.steps.splice(+a.dataset.i, 1);
            renderList(); renderDetail();
            break;
        case 'save-settings': toast(t('settings_saved')); break;
        case 'run':
            S.tab = 'steps';
            startJob(s, 0);
            renderList(); renderDetail(); renderLog();
            break;
        case 'stop': stopJob(); renderList(); renderDetail(); renderLog(); break;

        case 'wide': S.logWide = !S.logWide; $('layout').classList.toggle('log-wide', S.logWide); renderLogHead(); renderDetail(); break;
        case 'filter': S.filter = a.dataset.f; renderLogTools(); renderLogBox(); break;
        case 'expand-trace': S.expandedTrace = true; renderLogBox(); break;
        case 'copy': {
            const text = S.logs.map(l => `${l.ts} ${l.text}`).join('\n');
            (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.resolve()).finally(() => toast(t('copied')));
            break;
        }

        case 'create-user': {
            const u = $('nu-user').value.trim(), p = $('nu-pass').value;
            const em = $('nu-email').value.trim();
            if (!u || !p) { showMsg('nu-msg', 'error', t('fill_required')); break; }
            if (em && !EMAIL_RE.test(em)) { showMsg('nu-msg', 'error', t('email_invalid')); break; }
            USERS.push({ id: Math.max(...USERS.map(x => x.id)) + 1, username: u, display: $('nu-display').value.trim() || u, email: em, role: $('nu-role').value, active: true });
            renderModal();
            showMsg('nu-msg', 'success', t('user_created', { name: u }));
            break;
        }
        case 'save-user': toast(t('saved')); break;
        case 'edit-email': {
            const u = USERS.find(x => x.id === +a.dataset.uid);
            const v = prompt(t('prompt_email', { name: u.username }), u.email);
            if (v === null) break;
            if (v.trim() && !EMAIL_RE.test(v.trim())) { alert(t('email_invalid')); break; }
            u.email = v.trim();
            renderModal();
            toast(t('email_saved'));
            break;
        }
        case 'reset-pw': {
            const pw = prompt(t('prompt_new_password'));
            if (pw && pw.length >= 6) toast(t('pw_reset'));
            break;
        }
        case 'del-user': {
            const i = USERS.findIndex(x => x.id === +a.dataset.uid);
            if (i >= 0 && confirm(t('confirm_delete_user', { name: USERS[i].username }))) { USERS.splice(i, 1); renderModal(); }
            break;
        }
        case 'cp-save': {
            const cur = $('cp-cur').value, nw = $('cp-new').value, cf = $('cp-conf').value;
            if (!cur || !nw || !cf) showMsg('cp-msg', 'error', t('fill_all'));
            else if (nw.length < 6) showMsg('cp-msg', 'error', t('pw_min'));
            else if (nw !== cf) showMsg('cp-msg', 'error', t('pw_mismatch'));
            else {
                showMsg('cp-msg', 'success', t('pw_changed'));
                setTimeout(() => { if (S.modal === 'cp') { S.modal = null; renderModal(); } }, 900);
            }
            break;
        }

        case 'preview': applyPreview(a.dataset.p); break;
        case 'hide-preview': S.showPreview = false; renderPreview(); break;
    }
});

document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const s = selected();
    switch (el.dataset.input) {
        case 'search': S.search = el.value; renderList(); break;
        case 'url': if (s) s.url = el.value; break;
        case 'step-val': if (s) s.steps[+el.dataset.i].value = el.value; break;
    }
});

document.addEventListener('change', e => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    switch (el.dataset.input) {
        case 'collapse': S.collapse = el.checked; S.expandedTrace = false; renderLogBox(); break;
        case 'autoscroll': S.autoScroll = el.checked; if (S.autoScroll) renderLogBox(); break;
        case 'role': USERS.find(u => u.id === +el.dataset.uid).role = el.value; break;
        case 'active': {
            const u = USERS.find(x => x.id === +el.dataset.uid);
            u.active = el.checked;
            el.closest('.t-status').querySelector('.t-label').textContent = u.active ? t('active') : t('inactive');
            break;
        }
    }
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); }
});

const initial = location.hash.slice(1);
if (initial === 'users') { S.modal = 'users'; applyPreview('selected'); }
else applyPreview(['empty', 'selected', 'running', 'failed'].includes(initial) ? initial : 'empty');
</script>
</body>
</html>
